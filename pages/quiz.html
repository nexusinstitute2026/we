<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus LMS | Premium Quiz</title>
<link rel="icon" type="image/png" href="../images/logo.png">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/course.css">
<style>
  /* ── QUIZ PAGE HARD OVERRIDES ── */
  body.quiz-page { background: #0a1628 !important; }

  /* Kill all blobs */
  body.quiz-page .blobs { background: #0a1628 !important; }
  body.quiz-page .blob  { display: none !important; }

  /* Solid card */
  .q-card-premium {
    background: #0f1d35 !important;
    backdrop-filter: none !important;
    border: 1px solid rgba(255,255,255,0.14) !important;
  }

  /* Readable options */
  .opt-btn-premium {
    background: #1a2d4a !important;
    border: 1.5px solid rgba(255,255,255,0.18) !important;
    color: #dce8f8 !important;
  }
  .opt-btn-premium:hover {
    background: #1e3a5c !important;
    border-color: rgba(45,212,191,0.5) !important;
    color: #fff !important;
  }
  .opt-btn-premium.selected {
    background: #0c3b36 !important;
    border: 2px solid #0d9488 !important;
    color: #fff !important;
    box-shadow: 0 0 0 3px rgba(13,148,136,0.25) !important;
  }
  .opt-label-premium {
    background: rgba(255,255,255,0.1) !important;
    color: #c0d4f0 !important;
    border: 1.5px solid rgba(255,255,255,0.22) !important;
  }
  .opt-btn-premium.selected .opt-label-premium {
    background: #0d9488 !important;
    color: #fff !important;
    border-color: #0d9488 !important;
  }

  /* Progress bar visible */
  .progress-bar { background: rgba(255,255,255,0.1) !important; }
</style>
</head>
<body class="quiz-page">

<div class="blobs"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<header class="quiz-header">
  <div class="quiz-title">NEXUS PREMIUM QUIZ</div>
  <div class="quiz-meta">
    <div class="quiz-timer" id="quiz-timer">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span id="timer-text">--:--</span>
    </div>
    <button id="submit-btn" class="btn btn-gold btn-sm">Submit Quiz</button>
  </div>
</header>

  <div class="quiz-container">
    <div class="progress-label" style="margin-bottom:0.5rem">
      <span id="progress-text" class="eng" style="color:rgba(255,255,255,0.6);font-size:0.85rem;font-weight:600">Question 1 of X</span>
      <span id="answered-text" class="eng" style="color:var(--teal2);font-size:0.8rem;font-weight:700"></span>
    </div>
    <div class="progress-bar" style="margin-bottom:1.75rem; height:5px">
      <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
    </div>

    <div class="q-card-premium" id="question-card">
      <div class="skeleton" style="height:260px; border-radius:1.5rem"></div>
    </div>
  </div>

<div id="toast-container" class="toast-container"></div>

<script type="module">
import { requireAuth } from '../js/auth.js';
import { getQuiz, submitAttempt, getMyAttempt } from '../js/quiz.js';
import { showToast, fmtTime } from '../js/ui.js';

const profile = await requireAuth(['student']);

const urlParams = new URLSearchParams(window.location.search);
const quizId = urlParams.get('id');
if (!quizId) window.location.href = '../dashboard/student.html';

// ─── localStorage helpers ───────────────────────────────────────────────────
const PROGRESS_KEY = `quiz_progress_${quizId}_${profile.id}`;

function saveProgress() {
  const progress = {
    answers: userAnswers,
    currentQIndex,
    startTime,
    timeRemaining,
    isReopenedAttempt,
    savedAt: Date.now(),
  };
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); } catch(e) {}
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(PROGRESS_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function clearProgress() {
  try { localStorage.removeItem(PROGRESS_KEY); } catch(e) {}
}
// ────────────────────────────────────────────────────────────────────────────

let quizData = null;
let currentQIndex = 0;
let userAnswers = {};
let startTime = 0;
let timerInterval = null;
let timeRemaining = 0;
let displayedQuestions = []; // Array of { q, originalIdx, shuffledOptions }
let isReopenedAttempt = false; // true = local-only retake (no DB upload)

try {
  quizData = await getQuiz(quizId);
  if (!quizData || !quizData.questions || quizData.questions.length === 0) {
    throw new Error('Invalid quiz data');
  }

  const attempt = await getMyAttempt(quizId, profile.id);

  if (quizData.is_closed) {
    // Quiz is fully closed — no one can answer
    throw new Error('මෙම ප්‍රශ්න පත්‍රයට පිළිතුරු භාරගැනීම නතර කර ඇත.');
  }

  if (quizData.is_reopened && attempt) {
    // Admin reopened the quiz — student can retake, results saved locally only
    isReopenedAttempt = true;
    showToast('📢 Quiz නැවත විවෘත කර ඇත. ඔබේ නව පිළිතුරු ඔබේ browser හි සුරැකෙනු ඇත.', 'info');
  } else if (!quizData.is_reopened && attempt) {
    // Normal closed quiz — student already submitted, redirect to results
    window.location.href = '../pages/quiz-results.html?quiz=' + quizId;
    // (stop further execution)
    throw new Error('__REDIRECT__');
  }

  // Handle Shuffling
  displayedQuestions = quizData.questions.map((q, i) => {
    let opts = q.options.map((opt, idx) => ({ text: opt, originalIdx: idx }));
    if (quizData.shuffle_answers) {
      for (let k = opts.length - 1; k > 0; k--) {
        const j = Math.floor(Math.random() * (k + 1));
        [opts[k], opts[j]] = [opts[j], opts[k]];
      }
    }
    return { q, originalIdx: i, shuffledOptions: opts };
  });

  if (quizData.shuffle) {
    for (let i = displayedQuestions.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [displayedQuestions[i], displayedQuestions[j]] = [displayedQuestions[j], displayedQuestions[i]];
    }
  }

  // ── Restore saved progress ───────────────────────────────────────────────
  const saved = loadProgress();
  if (saved && saved.isReopenedAttempt === isReopenedAttempt) {
    const ageMs = Date.now() - (saved.savedAt || 0);
    const maxAge = (quizData.time_limit || 10800) * 1000; // default 3h
    if (ageMs < maxAge) {
      userAnswers = saved.answers || {};
      currentQIndex = Math.min(saved.currentQIndex || 0, displayedQuestions.length - 1);
      startTime = saved.startTime || Date.now();
      if (quizData.time_limit) {
        // Subtract elapsed time since save
        const elapsedSinceSave = Math.floor(ageMs / 1000);
        timeRemaining = Math.max(0, (saved.timeRemaining || quizData.time_limit) - elapsedSinceSave);
      }
    } else {
      clearProgress();
      startTime = Date.now();
      if (quizData.time_limit) timeRemaining = quizData.time_limit;
    }
  } else {
    startTime = Date.now();
    if (quizData.time_limit) timeRemaining = quizData.time_limit;
  }
  // ────────────────────────────────────────────────────────────────────────

  if (quizData.time_limit) {
    document.getElementById('timer-text').textContent = fmtTime(timeRemaining);
    startTimer();
  } else {
    document.getElementById('timer-text').textContent = 'No Limit';
  }

  renderQuestion();

} catch (error) {
  if (error.message === '__REDIRECT__') {
    // Redirect already triggered
  } else {
    console.error("CRITICAL:", error);
    document.getElementById('question-card').innerHTML = `
      <div style="text-align:center;padding:2rem;">
        <h3 style="margin-bottom:1rem">දෝෂයක් සිදුවිය</h3>
        <p style="color:var(--text-muted);margin-bottom:2rem">${error.message}</p>
        <button class="btn btn-teal" onclick="location.reload()">නැවත උත්සාහ කරන්න</button>
      </div>`;
  }
}

function startTimer() {
  const timerEl = document.getElementById('quiz-timer');
  const timerText = document.getElementById('timer-text');
  timerInterval = setInterval(() => {
    timeRemaining--;
    saveProgress(); // auto-save every second
    if (timeRemaining <= 0) {
      clearInterval(timerInterval);
      timeRemaining = 0;
      timerText.textContent = '00:00';
      submitQuiz();
    } else {
      timerText.textContent = fmtTime(timeRemaining);
      if (timeRemaining <= 60) timerEl.classList.add('urgent');
    }
  }, 1000);
}

function renderQuestion() {
  if (!displayedQuestions.length) return;
  const { q } = displayedQuestions[currentQIndex];
  const total = displayedQuestions.length;
  const answeredCount = Object.keys(userAnswers).length;
  
  document.getElementById('progress-text').textContent = `Question ${currentQIndex + 1} of ${total}`;
  document.getElementById('progress-fill').style.width = `${((currentQIndex + 1) / total) * 100}%`;
  document.getElementById('answered-text').textContent = `${answeredCount}/${total} Answered`;

  const reopenedBadge = isReopenedAttempt
    ? `<span style="background:rgba(234,179,8,0.15);color:#fbbf24;font-size:0.72rem;font-weight:700;padding:0.2rem 0.6rem;border-radius:99px;border:1px solid rgba(251,191,36,0.3);font-family:'Outfit',sans-serif">📱 Browser Save Only</span>`
    : '';

  const qHTML = `
    <div class="q-meta">
      <span class="q-index">Question ${currentQIndex + 1}</span>
      <div style="display:flex;align-items:center;gap:0.5rem">
        ${reopenedBadge}
        ${userAnswers[currentQIndex] !== undefined ? `<span style="color:var(--teal2);font-size:0.78rem;font-weight:700;font-family:'Outfit',sans-serif">✓ Answered</span>` : `<span style="color:rgba(255,255,255,0.3);font-size:0.78rem;font-weight:700;font-family:'Outfit',sans-serif">Not Answered</span>`}
      </div>
    </div>
    <div class="q-text-premium">${q.text}</div>
    <div class="options-list-premium">
      ${displayedQuestions[currentQIndex].shuffledOptions.map((opt, i) => `
        <div class="opt-btn-premium ${userAnswers[currentQIndex] === opt.originalIdx ? 'selected' : ''}" onclick="selectOption(${opt.originalIdx})">
          <div class="opt-label-premium">${String.fromCharCode(65 + i)}</div>
          <span>${opt.text}</span>
        </div>
      `).join('')}
    </div>
    <div class="quiz-footer-nav">
      <button class="btn btn-outline" onclick="prevQuestion()" ${currentQIndex === 0 ? 'disabled' : ''} style="color:rgba(255,255,255,0.7); border-color:rgba(255,255,255,0.15); min-width:100px">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        Prev
      </button>
      <span class="eng" style="color:rgba(255,255,255,0.35);font-size:0.8rem;font-weight:600">${currentQIndex + 1} / ${total}</span>
      ${currentQIndex === total - 1 
        ? `<button class="btn btn-gold" onclick="document.getElementById('submit-btn').click()" style="min-width:130px">Finish &amp; Submit</button>`
        : `<button class="btn btn-teal" onclick="nextQuestion()" style="min-width:130px">Next <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></button>`
      }
    </div>
  `;
  document.getElementById('question-card').innerHTML = qHTML;
}

window.selectOption = (idx) => {
  userAnswers[currentQIndex] = idx;
  saveProgress(); // save on every answer
  renderQuestion();
};

window.prevQuestion = () => { if (currentQIndex > 0) { currentQIndex--; saveProgress(); renderQuestion(); } };
window.nextQuestion = () => { if (currentQIndex < displayedQuestions.length - 1) { currentQIndex++; saveProgress(); renderQuestion(); } };

document.getElementById('submit-btn').addEventListener('click', () => {
  const answered = Object.keys(userAnswers).length;
  if (answered < displayedQuestions.length) {
    if (!confirm(`ඔබ තවමත් ප්‍රශ්න ${displayedQuestions.length - answered} කට පිළිතුරු දී නොමැත. Submit කිරීමට විශ්වාසද?`)) return;
  }
  submitQuiz();
});

async function submitQuiz() {
  if (timerInterval) clearInterval(timerInterval);
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'Submitting...';

  // Map answers back to original question indices
  const originalCount = quizData.questions.length;
  const answersArr = new Array(originalCount).fill(null);
  
  displayedQuestions.forEach((item, i) => {
    const studentAns = userAnswers[i];
    if (studentAns !== undefined) {
      answersArr[item.originalIdx] = studentAns;
    }
  });

  const timeTaken = Math.floor((Date.now() - startTime) / 1000);

  if (isReopenedAttempt) {
    // ── Reopened quiz: score locally, save to localStorage, show results page ──
    let score = 0;
    quizData.questions.forEach((q, i) => {
      if (answersArr[i] === q.correct) score++;
    });

    const localResult = {
      quizId: quizData.id,
      quizTitle: quizData.title,
      score,
      total: quizData.questions.length,
      answers: answersArr,
      timeTaken,
      submittedAt: new Date().toISOString(),
      isLocal: true,
    };

    try {
      localStorage.setItem(`quiz_local_result_${quizData.id}_${profile.id}`, JSON.stringify(localResult));
    } catch(e) {}

    clearProgress();
    // Redirect to results page with local flag
    window.location.href = `../pages/quiz-results.html?quiz=${quizData.id}&local=1`;
    return;
  }

  // ── Normal submit to database ────────────────────────────────────────────
  try {
    await submitAttempt({
      quizId: quizData.id,
      studentId: profile.id,
      answers: answersArr,
      questions: quizData.questions,
      timeTaken: timeTaken
    });
    clearProgress(); // clear saved progress on successful submit
    window.location.href = '../pages/quiz-results.html?quiz=' + quizData.id;
  } catch (error) {
    console.error(error);
    showToast("Submit කිරීම අසාර්ථකයි", "error");
    btn.disabled = false; btn.textContent = 'Submit Quiz';
  }
}
</script>
</body>
</html>

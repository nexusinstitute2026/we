.schedule-card { background:#fff; border:1px solid #e2e8f0; border-radius:var(--radius-lg); padding:1.5rem; margin-bottom:1.25rem; transition: all 0.3s; position: relative; display: flex; flex-direction: column; gap: 1rem; }
.schedule-card:hover { border-color: var(--teal); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
.schedule-meta { display:flex; gap:1rem; font-size:0.85rem; color:var(--text-muted); }
.account-badge { padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700; background: #e0f2fe; color: #0284c7; }
.account-badge.bypass { background: #fce7f3; color: #db2777; }
.status-badge { padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700; background: #dcfce7; color: #166534; }
.status-badge.cancelled { background: #fee2e2; color: #991b1b; }

.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; display:none; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
.modal-overlay.active { display:flex; }
.modal-box { background:#fff; width:90%; max-width:550px; border-radius:var(--radius-xl); padding:2rem; box-shadow:0 20px 60px rgba(0,0,0,0.15); }

.link-box { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
.link-box input { flex: 1; padding: 0.5rem; border: 1px solid #e2e8f0; border-radius: 0.5rem; background: #f8fafc; font-size: 0.85rem; }
.link-box button { padding: 0.5rem 1rem; border: none; background: var(--teal); color: white; border-radius: 0.5rem; cursor: pointer; font-size: 0.85rem; }
</style>

<!-- Schedule Modal -->
<div class="modal-overlay" id="schedule-modal">
  <div class="modal-box">
    <h2 style="font-size:1.2rem;font-weight:800;margin-bottom:1.5rem;color:var(--dark)">නව පන්තියක් යොදන්න</h2>
    
    <div class="form-group">
      <label class="form-label">මාතෘකාව (Topic) *</label>
      <input type="text" id="class-topic" class="form-input" placeholder="e.g. Revision Day 01">
    </div>
    
    <div class="form-group" style="display:flex;gap:1rem;">
      <div style="flex:1">
        <label class="form-label">දිනය සහ වේලාව *</label>
        <input type="datetime-local" id="class-start" class="form-input">
      </div>
      <div style="width:120px">
        <label class="form-label">කාලය (විනාඩි) *</label>
        <input type="number" id="class-duration" class="form-input" value="120">
      </div>
    </div>

    <div style="display:flex;gap:1rem;margin-top:1.5rem">
      <button class="btn btn-outline" onclick="closeModal()">අවලංගු කරන්න</button>
      <button class="btn btn-teal btn-lg" style="flex:1" id="save-class-btn" onclick="saveClass()">Schedule කරන්න ✓</button>
    </div>
  </div>
